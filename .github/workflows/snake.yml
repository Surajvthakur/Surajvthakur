# Generates the contribution-graph snake animation and publishes it to the
# `output` branch, so `main` never accrues generated-artifact commits.
name: Generate Snake

on:
  schedule:
    # Daily. Minute 17 rather than 0 — GitHub queues the top of the hour heavily
    # and on-the-hour crons are routinely delayed.
    - cron: "17 2 * * *"
  workflow_dispatch:

# A dispatch fired while the nightly run is mid-flight would otherwise race it
# on the publish step.
concurrency:
  group: snake
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # svg-only needs no checkout: it reads the contribution graph from the
      # GitHub API and writes the SVGs straight to disk.
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publishes the *contents* of dist/ to the root of the `output` branch.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
